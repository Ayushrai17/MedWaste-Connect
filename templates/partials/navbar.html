{% load static %}
<header class="app-navbar-header sticky-top" aria-label="Site header">
  <div class="container">
    <nav class="navbar navbar-expand-lg app-navbar-pill" aria-label="Main navigation">
      <!-- Left: Brand Logo & Typography -->
      <a class="navbar-brand navbar-brand-v5" href="{% url 'home' %}">
        <span class="brand-shield-icon">
          <i class="bi bi-shield-check"></i>
        </span>
        <span class="brand-name">
          <span class="brand-dark">MedWaste</span> <span class="brand-orange">Connect</span>
        </span>
      </a>

      <!-- Mobile Hamburger Toggler -->
      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
        <i class="bi bi-list fs-2 text-dark"></i>
      </button>

      <!-- Center: Navigation Links & Right: Action Buttons -->
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 nav-links-v5">
          <li class="nav-item">
            <a class="nav-link nav-link-v5 active" href="{% url 'home' %}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-v5" href="{% url 'home' %}#how">How It Works</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-v5" href="{% url 'home' %}#features">Features</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-v5" href="{% url 'home' %}#about">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-v5" href="{% url 'home' %}#contact">Contact</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2 nav-actions-v5">
          {% if user.is_authenticated %}
            <div class="dropdown">
              <button class="btn btn-pill btn-nav-register dropdown-toggle" type="button" id="userMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle me-1"></i>
                <span>{{ user.first_name|default:user.username }}</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 mt-2" aria-labelledby="userMenuButton">
                <li>
                  <h6 class="dropdown-header text-muted">Role: {{ user.get_role_display }}</h6>
                </li>
                <li>
                  <a class="dropdown-item py-2" href="{% url 'dashboard_redirect' %}">
                    <i class="bi bi-speedometer2 me-2 text-success"></i> Dashboard
                  </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                  <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="dropdown-item py-2 text-danger border-0 bg-transparent w-100 text-start">
                      <i class="bi bi-box-arrow-right me-2"></i> Logout
                    </button>
                  </form>
                </li>
              </ul>
            </div>
          {% else %}
            <a href="{% url 'register' %}" class="btn btn-pill btn-nav-register text-decoration-none d-none d-sm-inline-flex">
              Register Hospital
            </a>
            <a href="{% url 'login' %}" class="btn btn-pill btn-nav-login text-decoration-none">
              Login
            </a>
          {% endif %}
        </div>
      </div>
    </nav>
  </div>
</header>
